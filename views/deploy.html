<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deploy · ChurchWeb Global</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/assets/style.css"></head>
<body>
<header id="topbar"></header><script src="/assets/nav.js"></script>
<main>
  <section id="listCard">
    <div class="card">
      <h2>New customer</h2>
      <form id="newForm" class="row3">
        <div><label for="nName">Church name</label><input id="nName" type="text" required maxlength="80" placeholder="Britannia United Church" autocomplete="off"></div>
        <div><label for="nDomain">Their current website</label><input id="nDomain" type="text" placeholder="britanniaunited.ca" autocomplete="off"></div>
        <div><label for="nKind">Type</label><select id="nKind"><option value="new">New site</option><option value="migration">From DUDA</option></select></div>
        <div><label for="nPlan">Plan</label><select id="nPlan"><option value="website">Website</option><option value="email">Website + Email</option></select></div>
        <div><button class="primary" type="submit">Add customer</button></div>
      </form>
      <p class="err" id="nErr"></p>
    </div>
    <h2 class="boardtitle">Customers by phase</h2>
    <div id="board" class="board"></div>
    <p class="hint" id="empty" hidden>No customers yet. Add the first one above.</p>
    <div class="card">
    <details class="setup"><summary>Hostinger access test</summary><div class="btns"><button class="sm" id="hostProbe">Test Hostinger access (read-only)</button></div><ul class="res" id="hostOut"></ul></details>
    <details class="setup"><summary>Server setup status</summary><div id="setup"></div></details>
    </div>
  </section>
  <section id="detail" hidden></section>
</main>
<script src="/assets/deploy.js"></script>
</body></html>
