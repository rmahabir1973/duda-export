<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Domains · ChurchWeb Portal</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/assets/style.css"></head>
<body><header id="topbar"></header><script src="/assets/nav.js"></script>
<main class="wide"><section class="card"><h2>Domains we host</h2><p class="hint">Pulled from Cloudflare, DUDA, SmarterMail and Hostinger. It refreshes by itself every few hours, or press Sync now. The assistant and the Directory's "customer" marks use this list.</p>
<div class="statgrid" id="stats"></div>
<div class="btns"><button class="primary" id="sync" type="button">Sync now</button><span class="hint" id="syncMsg"></span></div>
<ul class="res" id="src"></ul>
<div class="filterbar"><input id="q" type="search" placeholder="Search a domain"><select id="gap"><option value="">All domains</option><option value="cloudflare">In Cloudflare</option><option value="duda">In DUDA</option><option value="smartermail">Has email with us</option><option value="hostinger">On Hostinger</option><option value="duda-not-cloudflare">In DUDA, not in Cloudflare</option><option value="cloudflare-not-duda">In Cloudflare, not in DUDA</option><option value="mail-not-cloudflare">Has email, not in Cloudflare</option><option value="no-mail">No email with us</option></select></div>
<div class="tablewrap"><table class="dirtable" style="min-width:0"><thead><tr><th>Domain</th><th>Cloudflare</th><th>DUDA</th><th>Email (SmarterMail)</th><th>Hostinger</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="pager"><button class="sm" id="prev">← Previous</button><span id="page"></span><button class="sm" id="next">Next →</button></div><p class="err" id="err"></p></section></main>
<script src="/assets/domains.js"></script></body></html>
